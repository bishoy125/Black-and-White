<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Filter Example</title>
  <style>
    /* Global Variables */
    :root {
      --primary-color: #28a745;
      --secondary-color: #007bff;
      --danger-color: #ff4d4d;
      --neutral-color: #333;
      --background-color: #f9f9f9;
      --white-color: #fff;
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      --heading-font: 'Arial', sans-serif;
      --transition-time: 0.3s;
    }

    /* Reset and Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, #000, #fff);
      color: var(--neutral-color);
      line-height: 1.5;
      padding: 20px;
    }

    h1,
    h2 {
      margin-bottom: 20px;
      font-family: var(--heading-font);
      font-weight: bold;
    }

    /* Back Button Styling */
    .back-button {
      font-size: 18px;
      color: var(--secondary-color);
      text-decoration: none;
      padding: 12px 18px;
      display: inline-block;
      margin-bottom: 20px;
      border: 2px solid var(--secondary-color);
      border-radius: 30px;
      transition: background-color var(--transition-time), color var(--transition-time);
    }

    .back-button:hover {
      background-color: var(--secondary-color);
      color: var(--white-color);
    }

    /* Navigation Styles */
    nav {
      margin-bottom: 20px;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      background-color: var(--neutral-color);
      padding: 15px;
      margin: 0;
      border-radius: 20px;
    }

    nav ul li {
      margin: 0 20px;
    }

    nav ul li a {
      color: var(--white-color);
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    nav ul li a:hover {
      color: var(--primary-color);
    }

    /* Search Bar and Filter Button Section */
    .button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    .search-bar {
      padding: 12px 20px;
      width: 280px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 30px;
      outline: none;
      transition: border-color var(--transition-time), box-shadow var(--transition-time);
    }

    .search-bar:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 5px rgba(40, 167, 69, 0.5);
    }

    .filter-button {
      padding: 12px 30px;
      background-color: var(--primary-color);
      color: var(--white-color);
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color var(--transition-time);
    }

    .filter-button:hover {
      background-color: #218838;
    }

    /* Product Store Section */
    .store {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 30px;
      justify-content: center;
    }

    .product {
      background: var(--white-color);
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      padding: 20px;
      transition: transform var(--transition-time), box-shadow var(--transition-time);
    }

    .product:hover {
      transform: translateY(-10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
      transition: transform var(--transition-time);
    }

    .product img:hover {
      transform: scale(1.05);
    }

    .product h3 {
      font-size: 1.3em;
      margin-bottom: 10px;
    }

    .product .price {
      font-size: 1.1em;
      color: var(--primary-color);
      margin-bottom: 20px;
    }

    .add-to-cart-button {
      background-color: var(--secondary-color);
      color: var(--white-color);
      padding: 12px 20px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      transition: background-color var(--transition-time);
    }

    .add-to-cart-button:hover {
      background-color: #0056b3;
    }

    /* Checkout Section */
    .checkout-section {
      padding: 30px;
      background-color: var(--white-color);
      margin: 30px 0;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      position: fixed;
      top: 100px;
      right: 50px;
      width: 300px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .checkout-section h2 {
      font-size: 1.6em;
      margin-bottom: 20px;
      text-align: center;
    }

    .checkout-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 1.1em;
    }

    .checkout-item span {
      flex-grow: 1;
    }

    .remove-button {
      background-color: var(--danger-color);
      color: var(--white-color);
      border: none;
      border-radius: 5px;
      padding: 5px 10px;
      cursor: pointer;
      transition: background-color var(--transition-time);
    }

    .remove-button:hover {
      background-color: #cc0000;
    }

    .checkout-total {
      font-size: 1.4em;
      font-weight: bold;
      margin-top: 20px;
      text-align: right;
      color: var(--primary-color);
    }

    /* Filter Modal */
    .filter-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .filter-modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    }

    .filter-modal-content h3 {
      margin-bottom: 20px;
    }

    .filter-modal-content label {
      margin-right: 10px;
    }

    .filter-modal button {
      background-color: var(--primary-color);
      color: var(--white-color);
      padding: 10px;
      border-radius: 5px;
      border: none;
      width: 100%;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .store {
        grid-template-columns: 1fr 1fr;
      }

      .checkout-section {
        position: relative;
        margin: 20px auto;
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Back Button -->
  <a href="javascript:history.back()" class="back-button">&#8592; Back</a>

  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="selling.html">Sell</a></li>
    </ul>
  </nav>

  <!-- Search Bar and Filter Button Section -->
  <div class="button-container">
    <input type="text" class="search-bar" id="searchInput" placeholder="Search Products..." oninput="searchProducts()" aria-label="Search Products" />
    <button class="filter-button" onclick="openFilterModal()" aria-label="Filter Products">Filter</button>
  </div>

  <!-- Product Store Section -->
  <div class="store" id="store">
    <div class="product" data-name="Laptop" data-price="1899.95" data-color="black">
      <img src="https://i0.wp.com/www.yugatech.com/wp-content/uploads/2016/06/LD0003209014_2_0003275197.jpg?resize=644%2C644" alt="Laptop">
      <h3>Laptop</h3>
      <p class="price">$1899.95</p>
      <button class="add-to-cart-button" onclick="addToCart('Laptop', 1899.95)">Add to Cart</button>
    </div>

    <div class="product" data-name="Iphone" data-price="899.95" data-color="white">
      <img src="https://www.istore.co.za/media/catalog/product/cache/7cbfd4bf9761b066f119e95af17e67c5/i/p/iphone_16_white_pdp_image_position_1__wwen_3.png" alt="Iphone">
      <h3>Iphone</h3>
      <p class="price">$899.95</p>
      <button class="add-to-cart-button" onclick="addToCart('Iphone', 899.95)">Add to Cart</button>
    </div>

    <div class="product" data-name="Ipad" data-price="700.95" data-color="white">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQMK6KWPx3EKGvTJxUX4gpvnzfA0it5BchNVQ&s" alt="Ipad">
      <h3>IPad Air 5th Generation 2022 64GB</h3>
      <p class="price">$700.95</p>
      <button class="add-to-cart-button" onclick="addToCart('Ipad', 700.95)">Add to Cart</button>
    </div>
  </div>

  <!-- Checkout Section -->
  <div class="checkout-section">
    <h2>Your Cart</h2>
    <div id="checkoutItems"></div>
    <div class="checkout-total">
      <span>Total: $0.00</span>
    </div>
    <button class="filter-button" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
  </div>

  <!-- Filter Modal -->
  <div class="filter-modal" id="filterModal">
    <div class="filter-modal-content">
      <h3>Filter Products</h3>
      <label for="filterColor">Color</label>
      <select id="filterColor" onchange="applyFilters()">
        <option value="">All</option>
        <option value="black">Black</option>
        <option value="white">White</option>
      </select>
      <button onclick="closeFilterModal()">Close</button>
    </div>
  </div>

  <script>
    // Function to search products dynamically
    function searchProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const products = document.querySelectorAll('.product');

      products.forEach(product => {
        const productName = product.getAttribute('data-name').toLowerCase();
        product.style.display = productName.includes(query) ? 'block' : 'none';
      });
    }

    // Add item to the cart and update the total
    function addToCart(productName, productPrice) {
      const checkoutItems = document.getElementById('checkoutItems');
      const checkoutTotal = document.querySelector('.checkout-total span');

      const itemDiv = document.createElement('div');
      itemDiv.classList.add('checkout-item');
      itemDiv.innerHTML = `${productName} - $${productPrice.toFixed(2)} <button class="remove-button" onclick="removeFromCart(this, ${productPrice})">Remove</button>`;
      checkoutItems.appendChild(itemDiv);

      let total = parseFloat(checkoutTotal.textContent.split('$')[1]) || 0;
      total += productPrice;
      checkoutTotal.textContent = `Total: $${total.toFixed(2)}`;
    }

    // Remove item from the cart and update the total
    function removeFromCart(button, productPrice) {
      button.closest('.checkout-item').remove();
      const checkoutTotal = document.querySelector('.checkout-total span');

      let total = parseFloat(checkoutTotal.textContent.split('$')[1]) || 0;
      total -= productPrice;
      checkoutTotal.textContent = `Total: $${total.toFixed(2)}`;
    }

    // Open filter modal
    function openFilterModal() {
      document.getElementById('filterModal').style.display = 'flex';
    }

    // Close filter modal
    function closeFilterModal() {
      document.getElementById('filterModal').style.display = 'none';
    }

    // Apply selected filter
    function applyFilters() {
      const colorFilter = document.getElementById('filterColor').value.toLowerCase();
      const products = document.querySelectorAll('.product');

      products.forEach(product => {
        const productColor = product.getAttribute('data-color').toLowerCase();
        product.style.display = !colorFilter || productColor === colorFilter ? 'block' : 'none';
      });
    }
  </script>
</body>

</html>
